[pytest]
# Pytest configuration for TaskPilot CI Pipeline

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multiple components
    api: Tests for API endpoints
    auth: Tests for authentication
    slow: Tests that take longer to run

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Test timeout (requires pytest-timeout plugin)
# timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore certain directories
norecursedirs = .git .venv venv node_modules __pycache__ .pytest_cache

