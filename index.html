<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1>Calculator</h1>
            <div class="display">
                <input type="text" id="display" placeholder="0" readonly>
            </div>
            <div class="buttons">
                <button class="btn clear" onclick="clearDisplay()">C</button>
                <button class="btn operator" onclick="appendOperator('/')">/</button>
                <button class="btn operator" onclick="appendOperator('*')">*</button>
                <button class="btn delete" onclick="deleteLast()">DEL</button>

                <button class="btn number" onclick="appendNumber('7')">7</button>
                <button class="btn number" onclick="appendNumber('8')">8</button>
                <button class="btn number" onclick="appendNumber('9')">9</button>
                <button class="btn operator" onclick="appendOperator('-')">-</button>

                <button class="btn number" onclick="appendNumber('4')">4</button>
                <button class="btn number" onclick="appendNumber('5')">5</button>
                <button class="btn number" onclick="appendNumber('6')">6</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>

                <button class="btn number" onclick="appendNumber('1')">1</button>
                <button class="btn number" onclick="appendNumber('2')">2</button>
                <button class="btn number" onclick="appendNumber('3')">3</button>
                <button class="btn operator" onclick="appendOperator('%')">%</button>

                <!-- Advanced Operations Row -->
                <button class="btn advanced" onclick="squareRoot()">√</button>
                <button class="btn advanced" onclick="square()">x²</button>
                <button class="btn advanced" onclick="cube()">x³</button>
                <button class="btn advanced" onclick="power()">x^y</button>

                <button class="btn advanced" onclick="reciprocal()">1/x</button>
                <button class="btn advanced" onclick="factorial()">n!</button>
                <button class="btn advanced" onclick="naturalLog()">ln</button>
                <button class="btn advanced" onclick="log10()">log</button>

                <button class="btn advanced" onclick="toggleSign()" style="grid-column: 1 / 3;">+/-</button>

                <button class="btn number zero" onclick="appendNumber('0')">0</button>
                <button class="btn number" onclick="appendNumber('.')">.</button>
                <button class="btn equals" onclick="calculate()">=</button>

        
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
